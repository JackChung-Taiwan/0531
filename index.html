<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0531 會議資料</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --surface:#ffffff;
      --line:#d8e1ea;
      --text:#1f2d3d;
      --muted:#5f7285;
      --primary:#1d5f91;
      --accent:#e8f2fa;
      --shadow:0 12px 30px rgba(20,45,70,.08);
      --radius:18px;
      --max:1180px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#f8fbfd 0%, var(--bg) 100%);
    }
    .wrap{width:min(var(--max),92vw);margin:0 auto;padding:28px 0 56px}
    .topbar{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:20px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:22px;
    }
    .brand h1{margin:0;font-size:28px;color:var(--primary);letter-spacing:.02em}
    .brand p{margin:8px 0 0;color:var(--muted);line-height:1.7}
    .chip{padding:8px 12px;border-radius:999px;background:var(--accent);color:var(--primary);font-weight:700;font-size:14px;border:1px solid #cfe0ee;white-space:nowrap}
    .card{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
    }
    h2{margin:0 0 14px;font-size:26px;color:#143d60}
    p{margin:0;line-height:1.85}
    .lead{color:#30495f;font-size:17px}
    .posters{display:grid;gap:18px;margin-top:18px}
    figure{margin:0}
    .poster{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
    .poster img{display:block;width:100%;height:auto}
    figcaption{padding:12px 14px;border-top:1px solid var(--line);font-weight:700;color:#486173;background:#fbfdff}
    .footer{text-align:center;color:#7a8c9b;font-size:14px;margin-top:26px}
    @media (max-width:900px){.topbar{display:block}.chip{display:inline-block;margin-top:12px}.wrap{width:min(94vw,1180px)}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand">
        <h1>0531 會議資料</h1>
        <p>學藝競賽報告整理。</p>
      </div>
      <span class="chip">學藝競賽報告</span>
    </header>

    <section class="card">
      <h2>1. 學藝競賽報告</h2>
      <p class="lead">以下為本次會議使用的兩張重點圖表，可作為成果報告與簡報素材。</p>
      <div class="posters">
        <figure class="poster">
          <img src="assets/01.png" alt="學藝競賽報告圖表第一張" />
          <figcaption>圖表 1｜前言與學藝競賽目的</figcaption>
        </figure>
        <figure class="poster">
          <img src="assets/02.png" alt="學藝競賽報告圖表第二張" />
          <figcaption>圖表 2｜觀察重點與統計分析</figcaption>
        </figure>
      </div>
    </section>

    <div class="footer">0531 會議資料</div>
  </main>
</body>
</html>
